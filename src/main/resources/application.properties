# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (optional, for debugging)
spring.h2.console.enabled=false

# Application Configuration
server.port=8080
spring.application.name=MercadoLibre-ItemDetail-API

# JWT Configuration
jwt.secret=MyVerySecureSecretKeyForJWTTokenGenerationAndValidation2026WithMoreBitsThanBeforeToMeetHS512RequirementsAndMakeSureItsLongEnough
jwt.expiration=3600000

# Logging Configuration
logging.level.root=INFO
logging.level.com.hackerrank.sample=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.name=application.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Resilience4j Configuration
resilience4j.circuitbreaker.instances.modelService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.modelService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.modelService.waitDurationInOpenState=10000
resilience4j.circuitbreaker.instances.modelService.permittedNumberOfCallsInHalfOpenState=3

resilience4j.circuitbreaker.instances.auditService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.auditService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.auditService.waitDurationInOpenState=5000

# Retry Configuration
resilience4j.retry.instances.modelService.maxAttempts=3
resilience4j.retry.instances.modelService.waitDuration=1000

resilience4j.retry.instances.auditService.maxAttempts=2
resilience4j.retry.instances.auditService.waitDuration=500
