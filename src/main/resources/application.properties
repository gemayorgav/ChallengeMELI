# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (optional, for debugging)
spring.h2.console.enabled=false

# Application Configuration
server.port=8080
spring.application.name=MercadoLibre-ItemDetail-API

# JWT Configuration
jwt.secret=MyVerySecureSecretKeyForJWTTokenGenerationAndValidation2026WithMoreBitsThanBeforeToMeetHS512RequirementsAndMakeSureItsLongEnough
jwt.expiration=3600000

# Logging Configuration
logging.level.root=INFO
logging.level.com.hackerrank.sample=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.name=application.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Resilience4j Configuration
resilience4j.circuitbreaker.instances.modelService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.modelService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.modelService.waitDurationInOpenState=10000
resilience4j.circuitbreaker.instances.modelService.permittedNumberOfCallsInHalfOpenState=3

resilience4j.circuitbreaker.instances.auditService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.auditService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.auditService.waitDurationInOpenState=5000

# Retry Configuration
resilience4j.retry.instances.modelService.maxAttempts=3
resilience4j.retry.instances.modelService.waitDuration=1000

resilience4j.retry.instances.auditService.maxAttempts=2
resilience4j.retry.instances.auditService.waitDuration=500

# ===== ACTUATOR CONFIGURATION (Health Checks & Metrics) =====
# Exponer endpoints de Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
# Mostrar detalles de health completos
management.endpoints.web.base-path=/api/v1/actuator
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Componentes de health a monitorear
management.health.db.enabled=true
management.health.diskSpace.enabled=true
management.health.ping.enabled=true

# Metricas
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.logback=true
management.metrics.enable.system=true

# ===== SPRINGDOC OPENAPI CONFIGURATION (Swagger/OpenAPI) =====
# OpenAPI/Swagger UI disponible en http://localhost:8080/swagger-ui.html
# JSON OpenAPI disponible en http://localhost:8080/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.defaultModelsExpandDepth=1
springdoc.swagger-ui.defaultModelExpandDepth=1
springdoc.api-docs.path=/v3/api-docs
springdoc.show-actuator=true
